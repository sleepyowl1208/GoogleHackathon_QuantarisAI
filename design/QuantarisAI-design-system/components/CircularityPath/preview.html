<body>
<div id="root" class="qa-pad"></div>
<script>
  var Q = window.Quantaris, h = React.createElement;
  function Demo(){ var s=React.useState('neutral'); var st=s[0];
    return h('div',{className:'qa-stack'},
      h('div',{className:'qa-row'},['neutral','analysing','discovered'].map(function(k){return h(Q.Button,{key:k,size:'sm',variant:k===st?'primary':'secondary',onClick:function(){s[1](k)}},k)})),
      h(Q.CircularityPath,{state:st,source:'Cutting floor',sourceSub:'Tiruppur unit',waste:'Cotton cutting scrap',wasteSub:'≈ 218 t / yr',steps:['Recovery','Recycled fibre','Recycled yarn'],value:'₹3.1 crore / yr',valueSub:'new product line'})); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
